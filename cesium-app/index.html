<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Ensure the container takes up the full screen */
      body { margin: 0; padding: 0; overflow: hidden; }
      #cesiumContainer { width: 100vw; height: 100vh; }
    </style>
    <title>Cesium Flooding Visualisation</title>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="cesium-tooltip" style="
      display: none; 
      position: absolute; 
      background: rgba(42, 42, 42, 0.9); 
      color: white; 
      padding: 8px; 
      border-radius: 4px; 
      pointer-events: none; 
      font-family: sans-serif; 
      z-index: 1000;
      border: 1px solid #777;">
    </div>
    <div id="controls" style="position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; width: 250px;">
    <h3>Control Panel</h3>
    
    <!-- This will be filled with POI buttons -->
    <div id="poi-links">
        <p><strong>Locations</strong></p>
    </div>

    <hr>

    <!-- Global actions -->
    <div id="global-actions">
        <p><strong>Vehicle Actions</strong></p>
        <button id="btn-spawn" style="width: 100%; margin-bottom: 5px;">Spawn Random Route</button>
        <button id="btn-zoom-vehicle" style="width: 100%;" disabled>Track Vehicle</button>
        <button id="btn-stop-tracking" style="width: 100%;" enabled>Stop Tracking</button>
    </div>
</div>
    <!-- Change this much later -->
    <script type="module" src="/src/cesium.js"></script> 
    
  </body>
</html>
